<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1890ff">
    <title>E-LOG 监控</title>
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div id="app">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">连接中...</span>
            <span class="time" id="currentTime">--:--</span>
        </div>

        <!-- 页面容器 -->
        <div class="page-container" id="pageContainer">
            <!-- 概览页 -->
            <div class="page active" id="page-home">
                <div class="card">
                    <div class="card-header">
                        <span>📊 系统概览</span>
                    </div>
                    <div class="card-body">
                        <div class="stat-row">
                            <div class="stat-item">
                                <span class="stat-value" id="datasourceCount">-</span>
                                <span class="stat-label">数据源</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-value" id="taskCount">-</span>
                                <span class="stat-label">任务</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-value" id="hdfsStatus">-</span>
                                <span class="stat-label">HDFS</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span>🔔 最近任务</span>
                    </div>
                    <div class="card-body" id="recentTasks">
                        <p class="empty">暂无任务</p>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span>💾 数据源</span>
                    </div>
                    <div class="card-body" id="recentDatasources">
                        <p class="empty">暂无数据源</p>
                    </div>
                </div>
            </div>

            <!-- 数据源页 -->
            <div class="page" id="page-datasource">
                <div class="page-title">数据源管理</div>
                <div class="list" id="datasourceList">
                    <p class="empty">暂无数据源</p>
                </div>
            </div>

            <!-- 任务页 -->
            <div class="page" id="page-tasks">
                <div class="page-title">任务调度</div>
                <div class="list" id="taskList">
                    <p class="empty">暂无任务</p>
                </div>
            </div>

            <!-- HDFS页 -->
            <div class="page" id="page-hdfs">
                <div class="page-title">文件管理</div>
                <div class="hdfs-path">
                    <span>路径:</span>
                    <span id="hdfsPath">/</span>
                </div>
                <div class="list" id="hdfsList">
                    <p class="empty">加载中...</p>
                </div>
            </div>

            <!-- 我的页 -->
            <div class="page" id="page-profile">
                <div class="page-title">我的</div>
                <div class="card">
                    <div class="card-body">
                        <div class="profile-item">
                            <span>👤 用户名</span>
                            <span id="username">-</span>
                        </div>
                        <div class="profile-item">
                            <span>📧 邮箱</span>
                            <span id="email">-</span>
                        </div>
                        <div class="profile-item">
                            <span>⏰ 登录时间</span>
                            <span id="loginTime">-</span>
                        </div>
                    </div>
                </div>
                <button class="btn-logout" onclick="logout()">退出登录</button>
            </div>
        </div>

        <!-- 底部导航 -->
        <nav class="bottom-nav">
            <a class="nav-item active" data-page="home">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">概览</span>
            </a>
            <a class="nav-item" data-page="datasource">
                <span class="nav-icon">📊</span>
                <span class="nav-text">数据源</span>
            </a>
            <a class="nav-item" data-page="tasks">
                <span class="nav-icon">📅</span>
                <span class="nav-text">任务</span>
            </a>
            <a class="nav-item" data-page="hdfs">
                <span class="nav-icon">📁</span>
                <span class="nav-text">文件</span>
            </a>
            <a class="nav-item" data-page="profile">
                <span class="nav-icon">👤</span>
                <span class="nav-text">我的</span>
            </a>
        </nav>

        <!-- Toast提示 -->
        <div class="toast" id="toast"></div>
    </div>

    <script src="js/mobile-app.js"></script>
</body>
</html>
