<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="E-LOG - 企业级日志分析系统，实时监控、智能分析、可视化大屏" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%236366f1'/><stop offset='100%25' style='stop-color:%23a855f7'/></linearGradient></defs><text x='50' y='72' font-size='60' text-anchor='middle' font-weight='bold' font-family='monospace' fill='url(%23g)'>E</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
    <title>E-LOG</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      #app { width: 100%; height: 100%; }
      #loading-screen {
        position: fixed; inset: 0; z-index: 9999;
        background: #0a0a0a;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 24px;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }
      #loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      #loading-screen .loader {
        width: 48px; height: 48px;
        border: 2px solid rgba(99,102,241,0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #loading-screen p { color: rgba(255,255,255,0.4); font-family: 'Inter', sans-serif; font-size: 14px; letter-spacing: 4px; text-transform: uppercase; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loading-screen"><div class="loader"></div><p>Loading</p></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
