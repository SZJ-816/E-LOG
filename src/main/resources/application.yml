server:
  port: 8080

spring:
  application:
    name: e-log-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.146.128:3306/elog?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.elog.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Hadoop配置
hadoop:
  namenode: hdfs://192.168.146.128:9000

# JWT配置
jwt:
  secret: elog-platform-secret-key-2024
  expiration: 86400000